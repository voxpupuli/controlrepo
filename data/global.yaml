---
lookup_options:
  profiles::ssh_keys::additional_keys::user_list:
    merge: deep

# current PMC members
pmc_members:
  - 'bastelfreak'
  - 'ekohl'
  - 'rwaffen'
  - 'sebastianrakel'
  - 'smortex'
  - 'binford2k'

# config for theforeman/puppet
puppet::puppetmaster: 'voxpupu.li'
puppet::show_diff: true
puppet::splay: true
puppet::agent: true
puppet::server: false

# config for saz/ssh
ssh::storeconfigs_enabled: false
ssh::server_options:
  PasswordAuthentication: 'no'
  PermitRootLogin: 'yes'
  X11Forwarding: 'no'
  PrintMotd: 'yes'
  AllowAgentForwarding: 'no'

# this is the global certificate for the mco user on puppetserver
# it allows everything
# https://choria.io/docs/deployment/first-user/
# mcollective class is managed via choria:
# https://github.com/choria-io/puppet-choria/blob/main/manifests/init.pp#L112-L114
mcollective::site_policies:
  - action: "allow"
    callers: "choria=mco.mcollective"
    actions: "*"
    facts: "*"
    classes: "*"

# merged with https://github.com/choria-io/puppet-mcollective/blob/main/data/common.yaml#L48
mcollective::plugin_classes:
  - mcollective_agent_bolt_tasks
  - mcollective_agent_shell
  - mcollective_agent_nettest
  - mcollective_agent_process
  - mcollective_agent_iptables

# don't rely on ancient cron
mcollective::facts_refresh_type: 'systemd'
