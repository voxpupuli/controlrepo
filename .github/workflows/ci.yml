---
name: CI

on: pull_request

permissions:
  contents: read

defaults:
  run:
    working-directory: ./site/profiles

concurrency:
  group: ${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  setup_matrix:
    defaults:
      run:
        working-directory: './site/profiles'
    name: 'Setup Test Matrix'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      puppet_unit_test_matrix: ${{ steps.get-outputs.outputs.puppet_unit_test_matrix }}
      github_action_test_matrix: ${{ steps.get-outputs.outputs.github_action_test_matrix }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup ruby
        uses: ruby/setup-ruby@003a5c4d8d6321bd302e38f6f0ec593f77f06600 # v1.319.0
        with:
          ruby-version: '3.4'
          bundler-cache: true
          working-directory: ./site/profiles
      - name: Display Ruby environment
        run: bundle env
      - name: Run static validations
        run: bundle exec rake validate lint check
      - name: Run rake rubocop
        run: bundle exec rake rubocop
      - name: Setup Test Matrix
        id: get-outputs
        run: bundle exec metadata2gha

  unit:
    needs: setup_matrix
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include: ${{fromJson(needs.setup_matrix.outputs.puppet_unit_test_matrix)}}
    env:
      BUNDLE_WITHOUT: development:system_tests:release
      PUPPET_VERSION: "~> ${{ matrix.puppet }}.0"
    name: Puppet ${{ matrix.puppet }} (Ruby ${{ matrix.ruby }})
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup ruby
        uses: ruby/setup-ruby@003a5c4d8d6321bd302e38f6f0ec593f77f06600 # v1.319.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: ./site/profiles
      - name: Run tests
        run: bundle exec rake parallel_spec

  acceptance:
    needs: setup_matrix
    runs-on: ubuntu-latest
    env:
      BUNDLE_WITHOUT: development:release
    strategy:
      fail-fast: false
      matrix:
        include: ${{fromJson(needs.setup_matrix.outputs.github_action_test_matrix)}}
    name: ${{ matrix.puppet.name }} - ${{ matrix.setfile.name }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup ruby
        uses: ruby/setup-ruby@003a5c4d8d6321bd302e38f6f0ec593f77f06600 # v1.319.0
        with:
          ruby-version: '3.4'
          bundler-cache: true
          working-directory: ./site/profiles
      - name: Prepare fixtures
        run: bundle exec rake spec_prep
      - name: Run tests
        run: bundle exec rake beaker
        env:
          LANG: en_US
          LC_ALL: en_US.UTF-8
          BEAKER_PUPPET_COLLECTION: ${{ matrix.puppet.collection }}
          BEAKER_setfile: ${{ matrix.setfile.value }}

  puppetfile:
    defaults:
      run:
        working-directory: .
    runs-on: ubuntu-latest
    name: Validate Puppetfile + all modules
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup ruby
        uses: ruby/setup-ruby@003a5c4d8d6321bd302e38f6f0ec593f77f06600 # v1.319.0
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Check for puppetfile syntax correctness
        run: bundle exec rake r10k:syntax
      - name: validate URLs in Puppetfile
        run: bundle exec rake r10k:validate
      - name: Check for puppetfile duplicates
        run: bundle exec rake r10k:duplicates
      - name: Check for puppetfile module deprecations
        run: bundle exec rake r10k:deprecation
      - name: Check for outdated modules
        run: bundle exec rake r10k:dependencies || true
      - name: Validate all dependencies in metadata.json
        run: bundle exec rake metadata_deps
      - name: validate all dependencies
        run: bundle exec puppet module list --modulepath site

  Hiera:
    defaults:
      run:
        working-directory: .
    runs-on: ubuntu-latest
    name: Validate Hiera
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          pip install --upgrade wheel setuptools pip
          pip install yamllint
      - name: Run yamllint
        run: yamllint --format github --strict data/
  tests:
    needs:
      - unit
      - acceptance
      - puppetfile
      - Hiera
    runs-on: ubuntu-latest
    name: Test suite
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
